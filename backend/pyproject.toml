[project]
name = "proteinbase-data-backend"
version = "0.1.0"
description = "Binder hit-rate dashboard backend: ingest and API over the Proteinbase snapshot"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "polars==1.19.0",
  "psycopg[binary]==3.2.3",
  "pydantic==2.10.4",
]

[dependency-groups]
dev = [
  "pytest==8.3.4",
  "httpx==0.28.1",
  "ruff==0.8.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI Depends() defaults
